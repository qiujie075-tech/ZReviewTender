import os
import json
import time
import requests
from google.oauth2 import service_account
from googleapiclient.discovery import build

SERVICE_ACCOUNT_JSON = os.environ.get("SERVICE_ACCOUNT_JSON")
PACKAGE_NAME = os.environ.get("PACKAGE_NAME")
WEBHOOK_URL = os.environ.get("WEBHOOK_URL")
GROQ_API_KEY = os.environ.get("GROQ_API_KEY")

print("=== Google Play Auto Reply ===")
print("Rule: Only reply to reviews without an existing developer reply.")

# =========================
# Check environment variables
# =========================

required_envs = {
    "SERVICE_ACCOUNT_JSON": SERVICE_ACCOUNT_JSON,
    "PACKAGE_NAME": PACKAGE_NAME,
    "GROQ_API_KEY": GROQ_API_KEY,
}

missing = [name for name, value in required_envs.items() if not value]

if missing:
    raise Exception(f"Missing environment variables: {', '.join(missing)}")


# =========================
# Google Play authentication
# =========================

creds_info = json.loads(SERVICE_ACCOUNT_JSON)

credentials = service_account.Credentials.from_service_account_info(
    creds_info,
    scopes=["https://www.googleapis.com/auth/androidpublisher"]
)

service = build(
    "androidpublisher",
    "v3",
    credentials=credentials
)


# =========================
# Generate targeted AI reply
# =========================

def ai_generate_reply(review_text, rating):

    url = "https://api.groq.com/openai/v1/chat/completions"

    headers = {
        "Authorization": f"Bearer {GROQ_API_KEY}",
        "Content-Type": "application/json"
    }

    prompt = f"""
You are the official customer support representative for PitPat.

Write a short, natural and specific response to this Google Play review.

Rating: {rating}/5
Review: "{review_text}"

Requirements:

1. Reply in the SAME LANGUAGE as the user's review.

2. Read the review carefully and respond specifically to what the user said.

3. Do NOT give a generic response such as:
   "Thanks for your feedback. We'll address the issues you raised."

4. If the user reports a bug or technical issue:
   acknowledge the specific issue and briefly apologize when appropriate.

5. If the review mentions login, connection, treadmill, device pairing,
   PitPat Band, workout tracking, subscription, payment, account,
   advertising, update, or another specific function, mention that
   specific issue naturally.

6. If the review is positive, thank the user and respond specifically
   to the feature or experience they liked.

7. If several problems are mentioned, acknowledge the main problems.

8. Do NOT invent fixes, refunds, compensation, policies or features.

9. Do NOT claim an issue has already been fixed unless the review
   itself clearly indicates that.

10. Do NOT ask the user to change their rating.

11. Do NOT mention AI or automated replies.

12. Keep the tone friendly, professional and human.

13. Maximum 320 characters.

Return ONLY the final reply.
"""

    data = {
        "model": "llama-3.1-8b-instant",
        "messages": [
            {
                "role": "user",
                "content": prompt
            }
        ],
        "max_tokens": 180,
        "temperature": 0.5
    }

    try:

        response = requests.post(
            url,
            headers=headers,
            json=data,
            timeout=30
        )

        if response.status_code != 200:
            print(
                f"AI request failed: HTTP {response.status_code} "
                f"{response.text[:500]}"
            )
            return None

        result = response.json()

        reply = (
            result
            .get("choices", [{}])[0]
            .get("message", {})
            .get("content", "")
            .strip()
        )

        if not reply:
            print("AI returned empty reply.")
            return None

        reply = reply.strip('"').strip("'").strip()

        if len(reply) > 320:
            reply = reply[:317].rstrip() + "..."

        return reply

    except Exception as e:
        print(f"AI error: {e}")
        return None


# =========================
# Get Google Play reviews
# =========================

def get_all_reviews():

    results = []

    try:

        request = service.reviews().list(
            packageName=PACKAGE_NAME,
            maxResults=100
        )

        while request is not None:

            response = request.execute()

            reviews = response.get("reviews", [])

            for review in reviews:

                review_id = review.get("reviewId")

                if not review_id:
                    continue

                comments = review.get("comments", [])

                user_comment = None
                developer_comment = None

                # Find both user review and developer reply
                for comment in comments:

                    if "userComment" in comment:
                        user_comment = comment["userComment"]

                    if "developerComment" in comment:
                        developer_comment = comment["developerComment"]

                if not user_comment:
                    continue

                review_text = user_comment.get("text", "").strip()
                star_rating = user_comment.get("starRating", 0)

                if not review_text:
                    continue

                # IMPORTANT:
                # If ANY developer reply already exists,
                # this automation will NEVER modify it.
                has_developer_reply = bool(
                    developer_comment
                    and developer_comment.get("text", "").strip()
                )

                results.append({
                    "id": review_id,
                    "text": review_text,
                    "rating": star_rating,
                    "has_developer_reply": has_developer_reply
                })

            request = service.reviews().list_next(
                previous_request=request,
                previous_response=response
            )

        return results

    except Exception as e:
        print(f"Failed to get reviews: {e}")
        return []


# =========================
# Post reply
# =========================

def post_reply(review_id, reply_text):

    try:

        service.reviews().reply(
            packageName=PACKAGE_NAME,
            reviewId=review_id,
            body={
                "replyText": reply_text
            }
        ).execute()

        print(f"Reply successful: {review_id}")

        return True

    except Exception as e:

        print(f"Reply failed: {review_id} - {e}")

        return False


# =========================
# Send report
# =========================

def send_report(success, skipped, failed):

    if not WEBHOOK_URL:
        return

    content = (
        "Google Play Auto Reply completed\n"
        f"New replies: {success}\n"
        f"Existing replies skipped: {skipped}\n"
        f"Failed / waiting for retry: {failed}"
    )

    data = {
        "msgtype": "text",
        "text": {
            "content": content
        }
    }

    try:
        requests.post(
            WEBHOOK_URL,
            json=data,
            timeout=10
        )
    except Exception as e:
        print(f"Webhook error: {e}")


# =========================
# MAIN
# =========================

print("Getting Google Play reviews...")

reviews = get_all_reviews()

print(f"Reviews checked: {len(reviews)}")

success_count = 0
skipped_count = 0
failed_count = 0

for review in reviews:

    review_id = review["id"]
    review_text = review["text"]
    rating = review["rating"]

    print("\n------------------------------")
    print(f"Review ID: {review_id}")
    print(f"Rating: {rating}")
    print(f"Review: {review_text[:200]}")

    # ==========================================
    # CORE RULE
    # Existing reply = NEVER TOUCH IT
    # ==========================================

    if review["has_developer_reply"]:

        print("SKIP: Developer reply already exists.")

        skipped_count += 1
        continue

    # ==========================================
    # No existing reply -> generate AI response
    # ==========================================

    print("No existing reply. Generating targeted response...")

    reply = ai_generate_reply(
        review_text,
        rating
    )

    # AI failed -> do nothing
    # It will retry during the next scheduled run.
    if not reply:

        print("AI generation failed. No reply posted.")

        failed_count += 1
        continue

    print(f"Generated reply: {reply}")

    if post_reply(
        review_id,
        reply
    ):
        success_count += 1
    else:
        failed_count += 1

    time.sleep(2)


print("\n==============================")

print(
    f"Completed: "
    f"{success_count} new replies, "
    f"{skipped_count} existing replies skipped, "
    f"{failed_count} failed."
)

send_report(
    success_count,
    skipped_count,
    failed_count
)
